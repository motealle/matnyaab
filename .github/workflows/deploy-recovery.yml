name: Deploy Recovery Bridge

on:
  push:
    branches:
      - main
      - migration/source-import
    paths:
      - ".github/workflows/deploy-recovery.yml"
      - "ops/recovery-bridge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matnyaab-production-recovery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_MATNYAAB_IR }}
      SITE_URL: https://www.matnyaab.ir

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2 syntax gate
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, mbstring, fileinfo
          coverage: none

      - name: Lint recovery source
        shell: bash
        run: |
          set -euo pipefail
          find ops/recovery-bridge -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Normalize FTP endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          server="$FTP_SERVER"
          server="${server%/}"
          case "$server" in
            ftp://*|ftps://*) url="$server" ;;
            *) url="ftp://$server" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Protect legacy SQLite from direct HTTP access
        shell: bash
        env:
          FTP_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --connect-timeout 15 --max-time 45 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --ftp-method nocwd \
            --upload-file ops/recovery-bridge/legacy-protection.htaccess \
            "$FTP_URL/matnyaab_with_license/.htaccess"

      - name: Backup live SQLite and root htaccess on destination
        shell: bash
        env:
          FTP_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/matnyaab-backup
          suffix="recovery-${GITHUB_RUN_ID}"

          curl --silent --show-error --fail \
            --connect-timeout 15 --max-time 90 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --ftp-method nocwd \
            "$FTP_URL/matnyaab_with_license/db.sqlite3" \
            --output /tmp/matnyaab-backup/db.sqlite3

          test -s /tmp/matnyaab-backup/db.sqlite3
          test "$(sqlite3 /tmp/matnyaab-backup/db.sqlite3 'PRAGMA integrity_check;')" = "ok"

          curl --silent --show-error --fail \
            --connect-timeout 15 --max-time 90 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --ftp-method nocwd \
            --upload-file /tmp/matnyaab-backup/db.sqlite3 \
            "$FTP_URL/matnyaab_with_license/db.sqlite3.$suffix.bak"

          if curl --silent --show-error --fail \
            --connect-timeout 15 --max-time 30 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --ftp-method nocwd \
            "$FTP_URL/.htaccess" \
            --output /tmp/matnyaab-backup/root.htaccess; then
              curl --silent --show-error --fail \
                --connect-timeout 15 --max-time 30 \
                --user "$FTP_USER:$FTP_PASSWORD" \
                --ftp-method nocwd \
                --upload-file /tmp/matnyaab-backup/root.htaccess \
                "$FTP_URL/matnyaab_with_license/root.htaccess.$suffix.bak"
          fi

          rm -f /tmp/matnyaab-backup/db.sqlite3
          echo "Protected backup completed next to the legacy database."

      - name: Assemble root-only shared-host release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release
          mkdir -p /tmp/release
          cp ops/recovery-bridge/front-controller.php /tmp/release/recovery.php
          cp ops/recovery-bridge/index.php /tmp/release/index.php
          cp ops/recovery-bridge/laravel.php /tmp/release/laravel.php
          cp ops/recovery-bridge/root.htaccess /tmp/release/.htaccess

      - name: Deploy root-only bridge over FTP
        shell: bash
        env:
          FTP_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          for rel in recovery.php index.php laravel.php .htaccess; do
            echo "Uploading $rel"
            curl --silent --show-error --fail \
              --connect-timeout 15 --max-time 90 \
              --user "$FTP_USER:$FTP_PASSWORD" \
              --ftp-method nocwd \
              --upload-file "/tmp/release/$rel" \
              "$FTP_URL/$rel"
          done

      - name: Production functional smoke
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 30 \
            "$SITE_URL/health/" -o /tmp/health.json

          cat /tmp/health.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert x["ok"] is True
          assert x["sqlite"] is True
          assert x["contents"] >= 1
          PY

          curl --silent --show-error --fail \
            "$SITE_URL/news/" -o /tmp/news.json
          python3 -m json.tool /tmp/news.json >/dev/null

          curl --silent --show-error --fail \
            "$SITE_URL/get_contents/?password=compat" -o /tmp/contents.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/contents.json', encoding='utf-8'))
          assert isinstance(x, list) and len(x) >= 1
          first=x[0]
          for k in ("content_id","content_title","title","filesize","package_file"):
              assert k in first, k
          open('/tmp/content-id.txt','w').write(str(first["content_id"]))
          print("Content contract OK; rows:", len(x))
          PY

          id="$(cat /tmp/content-id.txt)"
          code="$(curl --silent --show-error \
            --range 0-15 -o /tmp/cover-prefix.bin -w '%{http_code}' \
            "$SITE_URL/download_content_img/?id=$id")"
          test "$code" = "206" -o "$code" = "200"
          test -s /tmp/cover-prefix.bin

          curl --silent --show-error --fail \
            "$SITE_URL/update/version.txt" -o /tmp/version.txt
          test -s /tmp/version.txt

          db_code="$(curl --silent --show-error \
            -o /tmp/db-test.bin -w '%{http_code}' \
            "$SITE_URL/matnyaab_with_license/db.sqlite3")"
          case "$db_code" in
            401|403|404) ;;
            *) echo "::error::SQLite is directly downloadable (HTTP $db_code)"; exit 1 ;;
          esac

          curl --silent --show-error --fail             "$SITE_URL/login" -o /tmp/login.html
          grep -q "ورود به متن‌یاب" /tmp/login.html

          profile_code="$(curl --silent --show-error             -o /tmp/profile-response.html -w '%{http_code}'             "$SITE_URL/profile")"
          test "$profile_code" = "302"

          echo "Production bridge + Laravel canary smoke passed."

      - name: TLS certificate gate (warning during recovery)
        shell: bash
        run: |
          if curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 20 \
            "$SITE_URL/health/" >/dev/null; then
            echo "Strict TLS validation passed."
          else
            echo "::warning::PHP/SQLite service is operational, but the TLS certificate does not currently validate for www.matnyaab.ir. Fix AutoSSL/Let's Encrypt in the hosting panel."
          fi

      - name: Deployment summary
        run: |
          echo "Recovery bridge deployed."
          echo "SQLite was preserved and backed up before deployment."
          echo "Canonical smoke target: https://www.matnyaab.ir"
