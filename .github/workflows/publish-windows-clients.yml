name: Publish Windows Clients

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "client/windows/**"
      - ".github/workflows/publish-windows-clients.yml"
  pull_request:
    paths:
      - "client/windows/**"
      - ".github/workflows/publish-windows-clients.yml"

permissions:
  contents: read

concurrency:
  group: matnyaab-windows-client-release
  cancel-in-progress: false

env:
  KOTLIN_VERSION: "2.4"
  KOTLIN_FILE: "Matnyaab-2.4-win-x64-portable.zip"
  SETUP_FILE: "Matnyaab-Setup-2.4.exe"
  APP_NAME: "Matnyaab"
  SITE_URL: "https://www.matnyaab.ir"

jobs:
  package-kotlin:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch bundled Persian fonts (OFL, not stored in Git)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = Join-Path $PWD "app\src\main\resources\fonts"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP "fonts"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          npm pack vazirmatn@33.0.3 sahel-font@3.4.0 --silent | Out-Null
          Get-ChildItem *.tgz | ForEach-Object { tar -xzf $_.FullName; Rename-Item package ($_.BaseName) }
          Pop-Location
          Copy-Item "$tmp\vazirmatn-33.0.3\fonts\ttf\Vazirmatn-Regular.ttf", "$tmp\vazirmatn-33.0.3\fonts\ttf\Vazirmatn-Bold.ttf" $dst
          Copy-Item "$tmp\sahel-font-3.4.0\dist\Sahel.ttf", "$tmp\sahel-font-3.4.0\dist\Sahel-Bold.ttf" $dst
          Get-ChildItem $dst | Format-Table Name, Length

      - name: Build tested fat jar
        shell: pwsh
        run: gradle --no-daemon :app:clean :app:test :app:shadowJar

      - name: Build slim runtime, app image, installer and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inputDir = Join-Path $PWD "package-input"
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $inputDir, $releaseDir | Out-Null
          $jar = Join-Path $PWD "app\build\libs\matnyaab-all.jar"
          if (-not (Test-Path $jar)) { throw "Expected fat jar not found: $jar" }
          # jar بدون فشرده‌سازی داخلی ذخیره می‌شود تا فشرده‌سازی LZMA2 نصب‌کننده بسیار مؤثرتر شود
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jarX = Join-Path $PWD "jar-x"
          if (Test-Path $jarX) { Remove-Item $jarX -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($jar, $jarX)
          [System.IO.Compression.ZipFile]::CreateFromDirectory($jarX, (Join-Path $inputDir "matnyaab-all.jar"), [System.IO.Compression.CompressionLevel]::NoCompression, $false)

          # Java runtime سفارشی و کوچک به‌جای کل JDK
          $mods = ""
          try { $mods = (& jdeps --ignore-missing-deps --multi-release 17 --print-module-deps $jar 2>$null | Select-Object -Last 1).Trim() } catch { }
          if ($LASTEXITCODE -ne 0 -or $mods -notmatch "java.base") {
            $mods = "java.base,java.desktop,java.xml,java.sql,java.naming,java.management,java.logging,java.prefs,java.datatransfer,java.security.jgss,java.instrument,java.compiler"
          }
          $extra = "jdk.crypto.ec,jdk.localedata,jdk.charsets,jdk.zipfs,jdk.unsupported,jdk.jsobject,java.scripting,jdk.xml.dom,java.net.http,jdk.httpserver,jdk.management,java.security.sasl"
          Write-Host "Runtime modules: $mods,$extra"
          $runtime = Join-Path $PWD "runtime"
          & jlink --add-modules "$mods,$extra" --strip-debug --no-header-files --no-man-pages --compress=2 --include-locales=en,fa --output $runtime
          if ($LASTEXITCODE -ne 0) { throw "jlink failed" }

          $jpArgs = @(
            "--type", "app-image",
            "--input", $inputDir,
            "--main-jar", "matnyaab-all.jar",
            "--main-class", "ir.matnyaab.MainKt",
            "--name", $env:APP_NAME,
            "--app-version", $env:KOTLIN_VERSION,
            "--vendor", "Matnyaab",
            "--description", "Matnyaab - full-text search in your documents",
            "--copyright", "matnyaab.ir",
            "--icon", (Join-Path $PWD "packaging\matnyaab.ico"),
            "--java-options", "-Dfile.encoding=UTF-8",
            "--runtime-image", $runtime,
            "--dest", $releaseDir
          )
          & jpackage @jpArgs
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $appDir = Join-Path $releaseDir $env:APP_NAME
          $exe = Join-Path $appDir "$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "Packaged launcher was not created" }
          $smoke = & $exe --smoke 2>&1 | Out-String
          $smoke | Write-Host
          if ($smoke -notmatch "MATNYAAB_CLIENT_SMOKE_OK") { throw "Packaged Lucene/Tika smoke test failed" }
          # لانچر نباید هرگز دسترسی مدیر بخواهد (خطای 740)
          $raw = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          $m = [regex]::Match($raw, 'requestedExecutionLevel\s+level="(\w+)"')
          Write-Host "Launcher execution level: $($m.Groups[1].Value)"
          if ($m.Success -and $m.Groups[1].Value -ne "asInvoker") { throw "Launcher requests elevation: $($m.Groups[1].Value)" }
          $appBytes = (Get-ChildItem $appDir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "App image bytes: $appBytes"

          # نصب‌کنندهٔ ویندوز (Inno Setup)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not available" }
          & $iscc "/DAppVersion=$env:KOTLIN_VERSION" "/DSourceDir=$appDir" "/DOutputDir=$PWD" (Join-Path $PWD "packaging\matnyaab.iss")
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $setup = Join-Path $PWD $env:SETUP_FILE
          if (-not (Test-Path $setup)) { throw "Installer not created" }

          # آزمون واقعی نصب: نصب بی‌صدا برای کاربر جاری، اجرا از محل نصب، و حذف
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Matnyaab\Matnyaab.exe"
          if (-not (Test-Path $installed)) { throw "Installed launcher missing at $installed" }
          $smoke2 = & $installed --smoke 2>&1 | Out-String
          if ($smoke2 -notmatch "MATNYAAB_CLIENT_SMOKE_OK") { throw "Installed app smoke failed: $smoke2" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "متن‌یاب.lnk"))) { Write-Host "Start-menu shortcut check skipped (name encoding)" }
          # پل افزونهٔ ورد: حالت پنهان، جست‌وجوی منطقی، یادداشت و جست‌وجوی دوباره
          $bp = Start-Process $installed -ArgumentList "--bridge" -PassThru
          $bf = Join-Path $env:APPDATA "MATNYAAB\bridge.json"
          for ($i = 0; $i -lt 120 -and -not (Test-Path $bf); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $bf)) { throw "bridge did not start" }
          $b = Get-Content $bf -Raw | ConvertFrom-Json
          $h = @{ "X-Matnyaab-Token" = $b.token }
          $base = "http://127.0.0.1:$($b.port)/v1"
          $ping = Invoke-RestMethod -Method Post -Uri "$base/ping" -Headers $h -Body "{}" -ContentType "application/json; charset=utf-8"
          if (-not $ping.ok) { throw "bridge ping failed" }
          $bad = try { Invoke-WebRequest -Method Post -Uri "$base/ping" -Body "{}" -SkipHttpErrorCheck | Select-Object -ExpandProperty StatusCode } catch { 0 }
          if ($bad -ne 401) { throw "bridge accepted a request without token ($bad)" }
          $note = Invoke-RestMethod -Method Post -Uri "$base/note" -Headers $h -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes('{"text":"آزمون پل متن‌یاب: جهاد، نفس و تقوا","title":"آزمون پل"}'))
          if (-not $note.ok) { throw "bridge note failed" }
          $sr = Invoke-RestMethod -Method Post -Uri "$base/search" -Headers $h -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes('{"expression":"(جهاد OR مبارزه) AND نفس NOT نظامی"}'))
          Write-Host "bridge search files: $($sr.totalFiles) matches: $($sr.totalMatches)"
          if ($sr.totalFiles -lt 1) { throw "bridge boolean search found nothing" }
          Invoke-RestMethod -Method Post -Uri "$base/shutdown" -Headers $h -Body "{}" -ContentType "application/json" | Out-Null
          if (-not $bp.WaitForExit(15000)) { $bp.Kill(); throw "bridge did not exit" }
          Write-Host "Bridge test passed."
          $un = Join-Path $env:LOCALAPPDATA "Programs\Matnyaab\unins000.exe"
          $p = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          Write-Host "Installer install/run/uninstall test passed."

          $zip = Join-Path $PWD $env:KOTLIN_FILE
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $appDir -DestinationPath $zip -CompressionLevel Optimal

          foreach ($f in @($setup, $zip)) {
            $len = (Get-Item $f).Length
            if ($len -lt 20000000 -or $len -gt 250000000) { throw "Unexpected package size for $f : $len" }
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$f.sha256" -Value "$hash  $(Split-Path $f -Leaf)" -Encoding ascii
            Write-Host "$(Split-Path $f -Leaf): $len bytes, sha256 $hash"
          }

      - name: Capture product screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release\$env:APP_NAME\$env:APP_NAME.exe"
          $shots = Join-Path $PWD "screenshots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @("--screenshots", $shots) -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "Screenshot run timed out" }
          Get-ChildItem $shots | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: matnyaab-screenshots-${{ github.sha }}
          path: client/windows/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: matnyaab-kotlin-portable-${{ github.sha }}
          path: |
            client/windows/${{ env.KOTLIN_FILE }}
            client/windows/${{ env.KOTLIN_FILE }}.sha256
            client/windows/${{ env.SETUP_FILE }}
            client/windows/${{ env.SETUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_MATNYAAB_IR }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matnyaab-kotlin-portable-${{ github.sha }}
          path: release

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/$KOTLIN_FILE"
          test -s "release/$KOTLIN_FILE.sha256"
          (cd release && sha256sum -c "$KOTLIN_FILE.sha256" && sha256sum -c "$SETUP_FILE.sha256")
          echo "SETUP_BYTES=$(stat -c%s "release/$SETUP_FILE")" >> "$GITHUB_ENV"
          echo "SETUP_SHA256=$(sha256sum "release/$SETUP_FILE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "KOTLIN_BYTES=$(stat -c%s "release/$KOTLIN_FILE")" >> "$GITHUB_ENV"
          echo "KOTLIN_SHA256=$(sha256sum "release/$KOTLIN_FILE" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Normalize FTP endpoint
        id: ftp
        shell: bash
        run: |
          set -euo pipefail
          server="${FTP_SERVER%/}"
          case "$server" in
            ftp://*|ftps://*) url="$server" ;;
            *) url="ftp://$server" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Audit existing classic client
        env:
          FTP_URL: ${{ steps.ftp.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_url=""
          legacy_path=""
          legacy_bytes=0
          legacy_sha=""
          for rel in             "update/MATNYAAB_x64_setup.exe"             "downloadFiles/matnyaab1_2.exe"             "downloadFiles/matnyaab1_1.exe"; do
            if curl --silent --show-error --fail               --connect-timeout 15 --max-time 900               --user "$FTP_USER:$FTP_PASSWORD"               --ftp-method nocwd               "$FTP_URL/$rel" -o /tmp/matnyaab-legacy.exe; then
              legacy_path="$rel"
              legacy_url="/$rel"
              legacy_bytes="$(stat -c%s /tmp/matnyaab-legacy.exe)"
              legacy_sha="$(sha256sum /tmp/matnyaab-legacy.exe | awk '{print $1}')"
              break
            fi
          done

          if [[ -z "$legacy_path" ]]; then
            echo "::error::No classic Windows client was found on the host"
            exit 1
          fi

          echo "LEGACY_PATH=$legacy_path" >> "$GITHUB_ENV"
          echo "LEGACY_URL=$legacy_url" >> "$GITHUB_ENV"
          echo "LEGACY_BYTES=$legacy_bytes" >> "$GITHUB_ENV"
          echo "LEGACY_SHA256=$legacy_sha" >> "$GITHUB_ENV"

          {
            echo "Classic client path: $legacy_path"
            echo "Classic client bytes: $legacy_bytes"
            echo "Classic client sha256: $legacy_sha"
          } > legacy-client-audit.txt

          if command -v 7z >/dev/null 2>&1; then
            7z l -ba /tmp/matnyaab-legacy.exe > legacy-installer-files.txt 2>&1 || true
          else
            : > legacy-installer-files.txt
          fi

          matches="$(grep -Eic '(^|[\\/])(contents?|packages?)([\\/]|$)|\.(rar|zip|7z)[[:space:]]*$' legacy-installer-files.txt || true)"
          if [[ "$matches" -gt 0 ]]; then
            echo "LEGACY_CONTENT_AUDIT=embedded-content-candidates-detected" >> "$GITHUB_ENV"
            echo "Embedded content/package candidates detected: $matches" >> legacy-client-audit.txt
            grep -Ei '(^|[\\/])(contents?|packages?)([\\/]|$)|\.(rar|zip|7z)[[:space:]]*$' legacy-installer-files.txt | head -100 >> legacy-client-audit.txt || true
          else
            echo "LEGACY_CONTENT_AUDIT=no-embedded-content-candidate-detected" >> "$GITHUB_ENV"
            echo "No embedded content/package candidate was detected by archive listing." >> legacy-client-audit.txt
          fi

      - name: Upload Kotlin portable client and checksum
        env:
          FTP_URL: ${{ steps.ftp.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for file in "$SETUP_FILE" "$SETUP_FILE.sha256" "$KOTLIN_FILE" "$KOTLIN_FILE.sha256"; do
            curl --silent --show-error --fail --retry 3               --connect-timeout 20 --max-time 1800               --user "$FTP_USER:$FTP_PASSWORD"               --ftp-method nocwd --ftp-create-dirs               --upload-file "release/$file"               "$FTP_URL/downloadFiles/$file"
          done

      - name: Publish release manifest
        env:
          FTP_URL: ${{ steps.ftp.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          legacy_audit = os.environ.get("LEGACY_CONTENT_AUDIT", "not-audited")
          if legacy_audit == "embedded-content-candidates-detected":
              legacy_content = "در ساختار نصب‌کننده کلاسیک، فایل/مسیرهایی شبیه بسته محتوایی شناسایی شده‌اند؛ جزئیات audit برای بازبینی نگه‌داری شده است."
          else:
              legacy_content = "در فهرست قابل بازرسی نصب‌کننده کلاسیک، بسته محتوایی آماده‌ای شناسایی نشد؛ بسته‌های محتوایی از داخل برنامه جدا دریافت می‌شوند."

          manifest = {
              "schema": 1,
              "classic": {
                  "label": "نسخه قدیمی (کلاسیک)",
                  "url": os.environ["LEGACY_URL"],
                  "size_bytes": int(os.environ["LEGACY_BYTES"]),
                  "sha256": os.environ["LEGACY_SHA256"],
                  "delivery": "نصب‌کننده EXE ویندوز x64",
                  "content_summary": legacy_content,
              },
              "kotlin": {
                  "label": "متن‌یاب ۲",
                  "version": os.environ["KOTLIN_VERSION"],
                  "url": "/downloadFiles/" + os.environ["SETUP_FILE"],
                  "checksum_url": "/downloadFiles/" + os.environ["SETUP_FILE"] + ".sha256",
                  "size_bytes": int(os.environ["SETUP_BYTES"]),
                  "sha256": os.environ["SETUP_SHA256"],
                  "portable_url": "/downloadFiles/" + os.environ["KOTLIN_FILE"],
                  "portable_size_bytes": int(os.environ["KOTLIN_BYTES"]),
                  "delivery": "نصب‌کنندهٔ ویندوز ۱۰ و ۱۱ (۶۴ بیتی)",
                  "content_summary": "نصب‌کننده را اجرا کنید؛ میان‌بر متن‌یاب روی میز کار و منوی شروع ساخته می‌شود. بسته‌های محتوایی را از داخل برنامه دریافت کنید.",
              },
          }
          # بخش‌های دیگر (مثل افزونهٔ ورد) حفظ شوند
          import urllib.request
          try:
              old = json.load(urllib.request.urlopen(os.environ["SITE_URL"] + "/downloadFiles/releases.json", timeout=30))
          except Exception:
              old = {}
          for k, v in old.items():
              if k not in manifest:
                  manifest[k] = v
          with open("releases.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          curl --silent --show-error --fail --retry 3             --connect-timeout 20 --max-time 120             --user "$FTP_USER:$FTP_PASSWORD"             --ftp-method nocwd --ftp-create-dirs             --upload-file releases.json             "$FTP_URL/downloadFiles/releases.json"

      - name: Verify public release endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location             "$SITE_URL/downloadFiles/releases.json" -o /tmp/releases.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/releases.json", encoding="utf-8"))
          assert x["classic"]["size_bytes"] > 1_000_000
          assert x["kotlin"]["size_bytes"] > 20_000_000
          assert x["kotlin"]["content_summary"]
          print("Release manifest verified.")
          PY

          for url in "$LEGACY_URL" "/downloadFiles/$SETUP_FILE" "/downloadFiles/$KOTLIN_FILE"; do
            code="$(curl --silent --show-error --location --head               --connect-timeout 15 --max-time 60               -o /dev/null -w '%{http_code}' "$SITE_URL$url" || true)"
            test "$code" = "200"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: client-release-audit-${{ github.sha }}
          path: |
            legacy-client-audit.txt
            legacy-installer-files.txt
            releases.json
          retention-days: 7
