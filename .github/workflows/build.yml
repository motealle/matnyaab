name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - migration/source-import
      - migration/kotlin-import-live
    paths:
      - "web/**"
      - "client/windows/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "web/**"
      - "client/windows/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      client: ${{ steps.detect.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          [[ -f web/composer.json ]] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [[ -f client/windows/settings.gradle.kts || -f client/windows/settings.gradle ]] && echo "client=true" >> "$GITHUB_OUTPUT" || echo "client=false" >> "$GITHUB_OUTPUT"

  laravel:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, fileinfo
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Laravel bootstrap smoke
        run: php artisan --version

      - name: Package web release
        shell: bash
        run: |
          tar             --exclude='.env'             --exclude='storage/logs/*'             --exclude='storage/framework/cache/*'             --exclude='storage/framework/sessions/*'             --exclude='storage/framework/views/*'             -czf ../matnyaab-web-${GITHUB_SHA}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: matnyaab-web-${{ github.sha }}
          path: matnyaab-web-${{ github.sha }}.tar.gz
          retention-days: 14

  windows-client:
    needs: detect
    if: needs.detect.outputs.client == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client/windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Clean build from source
        shell: pwsh
        run: gradle --no-daemon :app:clean :app:build :app:shadowJar

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\..\..\client-artifacts" | Out-Null
          if (Test-Path "app\build\libs") {
            Copy-Item "app\build\libs\*" "..\..\..\client-artifacts" -Recurse -Force
          }
          if (Test-Path "app\build\distributions") {
            Copy-Item "app\build\distributions\*" "..\..\..\client-artifacts" -Recurse -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: matnyaab-windows-${{ github.sha }}
          path: client-artifacts
          if-no-files-found: warn
          retention-days: 14
